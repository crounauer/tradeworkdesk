name: Quality Gates

on:
  pull_request:
    paths:
      - ".github/workflows/quality-gates.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "artifacts/api-server/**"
      - "artifacts/business-app/**"
      - "artifacts/website-renderer/**"
      - "lib/**"
      - "scripts/**"
      - "templates/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/quality-gates.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "artifacts/api-server/**"
      - "artifacts/business-app/**"
      - "artifacts/website-renderer/**"
      - "lib/**"
      - "scripts/**"
      - "templates/**"

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --filter @workspace/api-server build

      - name: Test API server
        run: pnpm --filter @workspace/api-server test

      - name: Verify block integrity coverage
        run: pnpm run verify:blocks

      - name: Typecheck website renderer
        run: pnpm --filter @workspace/website-renderer typecheck

      - name: Typecheck business app
        run: pnpm --filter @workspace/business-app typecheck